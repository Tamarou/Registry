# ABOUTME: Public session checkout: a parent signs in, chooses children, and puts each child in a session at a price they qualify for.
# ABOUTME: One cart line per child and session; holding the seats, the one charge and completion follow the cart.

name: Session Checkout
description: Book children into camp and after-school sessions
slug: session-checkout
# Anyone may walk into this workflow, deliberately: the gate admits anyone to a
# workflow with the public mark. t/security/workflow-roles-cover-every-workflow.t
# enforces that every workflow declares roles or this mark.
public: true

steps:
  - slug: account
    label: Your account
    description: Sign in or create an account
    class: Registry::DAO::WorkflowSteps::AccountCheck

  - slug: children
    label: Children
    description: Choose the children to book
    class: Registry::DAO::WorkflowSteps::SelectChildren

  # Writes cart_lines, one per child and session, in the order shown, and
  # records the /terms agreement before the run moves on.
  - slug: cart
    label: Cart
    description: Choose a session, a price and a payment plan for each child
    class: Registry::DAO::WorkflowSteps::SessionCart

  # Asks the cart again at this instant, the purchase moment, then holds one
  # seat per line for the run and writes owed_payment: the cart's one charge,
  # each child's first charge summed, with each line's share and hold.
  - slug: hold
    label: Hold
    description: Hold the seats while you pay
    class: Registry::DAO::WorkflowSteps::HoldSessionSeats

  # Charges owed_payment, as HoldSessionSeats wrote it, while every line's hold
  # is live: one direct charge on the studio's account with Solo's fee. A cart
  # with an instalment child saves the card for the later instalments.
  - slug: payment
    label: Payment
    description: Pay for the cart
    class: Registry::DAO::WorkflowSteps::SessionCartPayment
