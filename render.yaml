# Render Blueprint. AUTHORITATIVE: the services are connected to this file, so
# what is committed here is what production gets -- including env vars, which is
# the thing that was not true before #459. Adding a variable here and merging it
# used to leave the running service untouched, which is how #452 shipped inert:
# the code deployed, LOG_LEVEL did not arrive, and the access log stayed dark.
#
# Two consequences worth knowing before editing:
#
#   - `sync: false` means "this file does not manage the value" -- the variable
#     is declared so the service has it, and the value is set in the dashboard.
#     Secrets stay that way. A sync will not overwrite them.
#   - A variable set ONLY in the dashboard and absent from this file is not
#     protected. Add it here, with `sync: false` if it is a secret.
#
# `tinyartempire-assets` (the static site STATIC_URL points at) is deliberately
# not declared here. Render does not delete services a Blueprint omits, and it
# has no build of its own worth describing -- but it must keep existing.
envVarGroups:
  - name: registry-database
    envVars:
      - key: DB_URL
        fromDatabase:
          name: registry-db
          property: connectionString
  - name: registry-stripe
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
  - name: registry-config
    envVars:
      - key: BASE_URL
        value: https://tinyartempire.com
      - key: NOTIFICATION_FROM_EMAIL
        value: noreply@tinyartempire.com
      - key: STATIC_URL
        value: https://tinyartempire-assets.onrender.com
      # Postmark server token. Set in the Render dashboard, not committed
      # here. Registry::DAO::Notification routes email through Postmark's
      # SMTP relay when this is present.
      - key: POSTMARK_SERVER_TOKEN
        sync: false


databases:
  # Named as the live instance actually is. This said `registry` / `registry_user`
  # while production has `registry_db` / `registry_db_user` -- harmless while
  # nothing read the file, and a description of a database that does not exist
  # once it is authoritative.
  - name: registry-db
    databaseName: registry_db
    user: registry_db_user
    plan: standard
    region: oregon

services:
  - type: web
    name: registry-app
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: registry-database
      - fromGroup: registry-stripe
      - fromGroup: registry-config
      - key: MOJO_MODE
        value: production
      - key: MOJO_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: PORT
        value: 10000
      - key: SERVICE_TYPE
        value: web
      # Render terminates TLS and proxies to the app. Enable Mojolicious
      # reverse-proxy mode so tx->remote_address reflects the real client IP
      # (from Render's trusted X-Forwarded-For) instead of the proxy address.
      # The rate limiter keys on remote_address, so this is required for the
      # per-client limit to apply per user rather than collectively.
      - key: MOJO_REVERSE_PROXY
        value: 1
      # The per-request access line Registry emits in after_dispatch is logged
      # at debug, and the logger defaults to info -- so without this, nothing
      # records that a request happened at all, and the request_id / user_id /
      # tenant_id context exists for lines nobody can correlate against. This
      # is what makes "where did this visitor stop" answerable from the logs.
      # Only the web service: the worker's debug output is Minion polling.
      - key: LOG_LEVEL
        value: debug
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: registry-storage
      mountPath: /app/storage
      sizeGB: 1

  - type: worker
    name: registry-worker
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - fromGroup: registry-database
      - fromGroup: registry-stripe
      - fromGroup: registry-config
      - key: MOJO_MODE
        value: production
      - key: MOJO_SECRET
        fromService:
          type: web
          name: registry-app
          envVarKey: MOJO_SECRET
      - key: SERVICE_TYPE
        value: worker
    autoDeploy: true

# registry-scheduler is deliberately NOT declared here.
#
# It ran `registry job attendance_check` and `registry job waitlist_expiration`
# every five minutes (docker-entrypoint.sh, SERVICE_TYPE=scheduler) -- and the
# web service already enqueues those same jobs on a recurring schedule
# (lib/Registry.pm's startup: attendance_check, domain_verification,
# waitlist_expiration, process_waitlist). So it is redundant, which is why it is
# suspended in Render.
#
# Declaring it in a file that production follows would resurrect it, and the
# recurring jobs carry no idempotency keys yet (#250) -- so a second scheduler
# means duplicate attendance notifications, not merely duplicate work. If it is
# ever wanted back, #250 comes first.
