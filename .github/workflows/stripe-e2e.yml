# ABOUTME: GitHub Actions workflow for real-Stripe gated test suites (Perl + Playwright).
# ABOUTME: Blocking -- a failure here is a failure, and a missing test key is reported as one.

name: Stripe E2E

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  stripe-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Skip for fork PRs: they have no access to repo secrets.
    # Runs on direct pushes to main and on same-repo PRs only.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    env:
      # Stripe test-mode secrets -- must be pk_test_* / sk_test_* / whsec_* values.
      # Set STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, and STRIPE_WEBHOOK_SECRET
      # in GitHub repo Settings → Secrets and variables → Actions.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      EMAIL_SENDER_TRANSPORT: Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client build-essential libssl-dev libz-dev

    - name: Install cpanm and Carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    - name: Cache Perl dependencies
      uses: actions/cache@v4
      with:
        path: ~/perl5
        key: ${{ runner.os }}-perl-${{ hashFiles('cpanfile.snapshot') }}
        restore-keys: |
          ${{ runner.os }}-perl-

    - name: Install Perl dependencies
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        carton install --deployment

    - name: Install Node dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Verify Test::PostgreSQL can start
      run: |
        export PATH="$HOME/perl5/bin:$PATH"
        carton exec perl -MTest::PostgreSQL -e 'my $pg = Test::PostgreSQL->new; print "Test::PostgreSQL OK: ", $pg->uri, "\n"'

    # Without this, the job passes without testing anything. Every file under
    # t/stripe-live/ calls Test::Registry::StripeConnect::available(), which is
    # `$ENV{STRIPE_SECRET_KEY} =~ /^sk_test_/`, and plan skip_all when it is
    # false. No key was ever provisioned, so the suite reported
    # `Files=4, Tests=0 ... Result: NOTESTS` -- and prove exits 0 on NOTESTS, so
    # the checks UI showed a green tick. A SKIP and a PASS must not look alike in
    # the one suite that guards the money path against real Stripe.
    - name: Require a Stripe test key
      run: |
        case "${STRIPE_SECRET_KEY}" in
          sk_test_*) echo "Stripe test key present; the live suites will run." ;;
          "") echo "::error::STRIPE_SECRET_KEY is not set. Add a Stripe TEST-mode secret key (sk_test_...) under Settings -> Secrets and variables -> Actions. Until then this suite tests nothing."
              exit 1 ;;
          sk_live_*) echo "::error::STRIPE_SECRET_KEY is a LIVE key. This suite creates real charges against whatever key it is given; only sk_test_ values are permitted."
              exit 1 ;;
          *) echo "::error::STRIPE_SECRET_KEY does not start with sk_test_, so every file under t/stripe-live/ will skip_all and report success without testing anything."
             exit 1 ;;
        esac

    - name: Run real-Stripe Perl suites
      run: |
        export PATH="$HOME/perl5/bin:$PATH"
        carton exec prove -lv t/stripe-live/

    - name: Run Playwright payment smoke test
      run: |
        npx playwright test t/playwright/payment-smoke.spec.js --project=chromium

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stripe-e2e-playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stripe-e2e-test-results
        path: test-results/
        retention-days: 14
