# ABOUTME: GitHub Actions workflow for Playwright end-to-end browser tests.
# ABOUTME: Runs the suite against a shared Test::PostgreSQL DB + server started by globalSetup.

name: Playwright

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  e2e:
    # ubuntu-latest became 26.04, which Playwright 1.55.1 refuses ("does not
    # support chromium on ubuntu26.04-x64"), so this job stopped before any
    # test. Pinned until Playwright is moved to a release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client build-essential libssl-dev libz-dev

    - name: Install cpanm and Carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # No ~/perl5 cache (as in ci.yml): carton installs into ./local, so the
    # cache saved nothing, and its key named only "Linux". (It was first
    # blamed for "IO::Socket::SSL 2.009+ required"; the cause was the
    # OPENSSL_PREFIX mismatch fixed in the install step below.)
    - name: Install Perl dependencies
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        # Build Net::SSLeay against the system OpenSSL. actions-setup-perl
        # exports OPENSSL_PREFIX pointing at its own (3.2+) OpenSSL, while
        # DBD::Pg's libpq uses the system's (3.0 on 24.04): whichever loads first
        # owns libssl.so.3 in the process, and a process that touched the
        # database first then failed "version `OPENSSL_3.2.0' not found" --
        # Mojo reports that as "IO::Socket::SSL 2.009+ required for TLS support".
        # Unsetting it was not enough (Makefile.PL found the toolcache
        # OpenSSL anyway), so name the system one.
        export OPENSSL_PREFIX=/usr
        carton install --deployment
        # Prove it: load the database client first, then TLS -- the order that
        # broke -- and show which libssl Net::SSLeay links.
        ldd local/lib/perl5/x86_64-linux/auto/Net/SSLeay/SSLeay.so | grep libssl
        carton exec perl -MDBD::Pg -MIO::Socket::SSL -e 'print "IO::Socket::SSL $IO::Socket::SSL::VERSION loads after libpq\n"'

    - name: Install Node dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox

    # The harness provisions its own ephemeral Postgres via Test::PostgreSQL
    # (globalSetup), so no service container is needed. Confirm Test::PostgreSQL
    # can start on the runner before running the suite; fail fast with a clear
    # message if the postgres binaries are unavailable.
    - name: Verify Test::PostgreSQL can start
      run: |
        export PATH="$HOME/perl5/bin:$PATH"
        carton exec perl -MTest::PostgreSQL -e 'my $pg = Test::PostgreSQL->new; print "Test::PostgreSQL OK: ", $pg->uri, "\n"'

    # No STRIPE_SECRET_KEY: registration's free path stays in demo/decision-step
    # mode and no Stripe calls are made.
    - name: Run Playwright tests
      env:
        EMAIL_SENDER_TRANSPORT: Test
      run: |
        export PATH="$HOME/perl5/bin:$PATH"
        npx playwright test --project=chromium --project=firefox

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 14
