name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC for quality checks
    - cron: '0 2 * * 0'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpq-dev \
          postgresql-client \
          build-essential \
          libssl-dev \
          libz-dev

    - name: Install cpanm and carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    - name: Cache Perl dependencies
      uses: actions/cache@v4
      with:
        path: ~/perl5
        key: ${{ runner.os }}-perl-${{ hashFiles('cpanfile.snapshot') }}
        restore-keys: |
          ${{ runner.os }}-perl-

    - name: Install Perl dependencies
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        carton install --deployment

    - name: Setup test database
      run: |
        export PGPASSWORD=postgres
        # Wait for PostgreSQL to be ready with better reliability
        for i in {1..60}; do
          if pg_isready -h localhost -U postgres -d postgres; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/60)"
          sleep 3
        done
        
        # Create test database with proper error handling
        createdb -h localhost -U postgres registry_test || true
        
        # Verify database was created
        psql -h localhost -U postgres -lqt | cut -d \| -f 1 | grep -qw registry_test
        echo "Test database registry_test is ready"
        
    - name: Deploy database schema
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        export PGPASSWORD=postgres
        carton exec sqitch deploy db:pg://postgres@localhost/registry_test

    - name: Import workflows and templates
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        export PGPASSWORD=postgres
        export DB_URL="postgresql://postgres:postgres@localhost:5432/registry_test"
        echo "Importing workflows..."
        carton exec ./registry workflow import registry || echo "Workflow import failed, continuing..."
        echo "Importing templates..."
        carton exec ./registry template import registry || echo "Template import failed, continuing..."
        echo "Import phase completed"

    - name: Clean test database
      run: |
        export PGPASSWORD=postgres
        # Clean up any existing test artifacts
        psql -h localhost -U postgres -d registry_test -c "
          TRUNCATE users, family_members, enrollments, payments, attendance_records, 
                   waitlist, sessions, events, session_events, projects, locations, 
                   messages, message_recipients CASCADE;" || true
        echo "Database cleaned for fresh test run"

    # The suite does NOT use the service container above: Test::Registry::DB
    # calls Test::PostgreSQL->new, which builds its own server, and each test
    # overwrites DB_URL with that ephemeral URI. Test::PostgreSQL picks the
    # HIGHEST major it finds (_find_program falls back to
    # `sort { $b cmp $a } glob "/usr/lib/postgresql/*"`), so the tested version
    # is an image detail that moves when GitHub rebuilds the runner. Report it,
    # and fail below the real floor -- the schema uses gen_random_uuid() in 20+
    # places with no CREATE EXTENSION anywhere in sql/, so it needs the built-in,
    # which is 13+. (CONTRIBUTING.md and docs/TECHNICAL.md say 12+; they are
    # wrong, and #334 tracks pinning this to production's major rather than
    # merely observing it.)
    - name: Report the PostgreSQL major the suite will actually use
      run: |
        # Same selection Test::PostgreSQL::_find_program makes: highest major present.
        server=$(ls -d /usr/lib/postgresql/* 2>/dev/null | sed 's#.*/##' | sort -rn | head -1)
        echo "Test::PostgreSQL will use PostgreSQL major: ${server:-unknown}"
        echo "Production (Render registry-db) runs: 18"
        case "$server" in
          ''|*[!0-9]*) echo "::error::could not determine the PostgreSQL major on this runner"; exit 1 ;;
        esac
        if [ "$server" -lt 13 ]; then
          echo "::error::PostgreSQL $server is below the real floor of 13 (gen_random_uuid is built-in from 13; sql/ never CREATE EXTENSION pgcrypto)"
          exit 1
        fi
        if [ "$server" -ne 18 ]; then
          echo "::warning::the suite is running on PostgreSQL $server, production runs 18 (#334)"
        fi

    - name: Run test suite
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        export PGPASSWORD=postgres
        export DB_URL="postgresql://postgres:postgres@localhost:5432/registry_test"
        export EMAIL_SENDER_TRANSPORT=Test
        # Placeholder so the Stripe DAO constructs; these tests make no real API
        # calls. It must NOT start with sk_test_: t/stripe-live/ gates itself on
        # that prefix, so a test-shaped placeholder makes the live suite believe
        # Stripe is reachable and fail against the real API. Real keys live in
        # the stripe-e2e workflow.
        export STRIPE_SECRET_KEY=ci_placeholder_not_a_stripe_key
        # Run tests sequentially to avoid database conflicts
        timeout 20m carton exec prove -lr t/ --formatter=TAP::Formatter::Console

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install Perl::Critic
      run: |
        cpanm --notest Perl::Critic

    - name: Run Perl::Critic (non-blocking)
      run: |
        # Run perlcritic but don't fail the build on warnings
        # since Object::Pad code doesn't follow traditional Perl conventions
        find lib -name "*.pm" -exec perlcritic --severity=3 --quiet {} \; || true
        echo "Perl::Critic completed (warnings are informational only)"

    - name: Check for orphaned sqitch changes
      run: |
        # Every sql/deploy/*.sql must have a matching change entry in
        # sql/sqitch.plan. A change name is the first whitespace-delimited field
        # of a plan line; pragmas (%...) and comments (#...) never equal a change
        # name, so an exact first-field comparison is robust regardless of the
        # name's characters or whether it is followed by a space or a [requires].
        orphans=0
        for f in sql/deploy/*.sql; do
          n=$(basename "$f" .sql)
          awk -v n="$n" '$1 == n { found = 1 } END { exit found ? 0 : 1 }' sql/sqitch.plan \
            || { echo "ORPHAN: $n"; orphans=1; }
        done
        if [ "$orphans" -ne 0 ]; then
          echo "::error::Orphaned sql/deploy files are not in sql/sqitch.plan"
          exit 1
        fi
        echo "No orphaned sqitch changes."

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security checks
      run: |
        echo "Checking for common security issues..."
        
        # Check for hardcoded secrets (basic patterns)
        if grep -r -i "password\s*=" --include="*.pm" --include="*.pl" lib/ | grep -v "EXAMPLE\|TODO\|FIXME" | head -5; then
          echo "WARNING: Potential hardcoded passwords found"
        fi
        
        # Check for SQL injection patterns
        if grep -r "qq{.*\$" --include="*.pm" lib/ | head -5; then
          echo "WARNING: Potential SQL injection patterns found"
        fi
        
        echo "Security check completed"

  database-compatibility:
    runs-on: ubuntu-latest
    # No `if:` here, deliberately. This job used to be gated on
    #   contains(github.event.head_commit.modified, 'sql/')
    # and `head_commit` is null on pull_request events, so both contains() calls
    # were false and the job skipped on every PR -- including the ones that
    # rewrite sql/deploy/. It ran only after merge, or on the weekly cron, which
    # is precisely when a migration-compatibility failure is most expensive.
    #
    # Gating correctly on changed paths needs either a third-party filter action
    # or a base-ref diff with its own edge cases (shallow clones, force pushes,
    # first push on a branch). Running it every time costs three parallel jobs
    # and cannot silently skip, which is the property that was missing.

    strategy:
      matrix:
        # The versions that matter: production (Render `registry-db`) runs 18,
        # and 16/17 cover the majors below it. 14 and 15 were listed here while
        # the job never ran; nothing deploys them.
        postgres-version: [16, 17, 18]
    
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpq-dev \
          postgresql-client \
          build-essential

    - name: Install cpanm and carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # This job now runs on every PR rather than almost never, so its
    # dependency install is worth caching the way the test job's is.
    - name: Cache Perl dependencies
      uses: actions/cache@v4
      with:
        path: ~/perl5
        key: ${{ runner.os }}-perl-${{ hashFiles('cpanfile.snapshot') }}
        restore-keys: |
          ${{ runner.os }}-perl-

    - name: Install Perl dependencies
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        carton install --deployment

    - name: Test database migration
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        export PGPASSWORD=postgres
        
        echo "Testing PostgreSQL ${{ matrix.postgres-version }} migration..."
        
        # Create test database
        createdb -h localhost -U postgres registry_migration_test
        
        # Deploy schema
        carton exec sqitch deploy db:pg://postgres@localhost/registry_migration_test
        
        # Verify deployment
        carton exec sqitch status db:pg://postgres@localhost/registry_migration_test
        
        echo "Migration test completed successfully"

    # The `Test schema rollback` step that used to be here proved nothing and has
    # been removed rather than repaired. It ran
    #   carton exec sqitch revert -n 3 ... || true
    # where `|| true` swallowed any failure, and carton parsed `-n` as its own
    # --noverbose before sqitch ever saw it, so the revert was never attempted.
    # The redeploy on the next line then ran against an unreverted database and
    # succeeded vacuously.
    #
    # t/database/revert-round-trip.t grades reverts properly -- per change,
    # deploy to parent, dump, deploy, revert, dump, diff -- and runs in the test
    # job. That is the harness; this step was a decoy beside it.

  quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client build-essential

    - name: Install dependencies and tools
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton
        carton install --deployment

    - name: Check dependencies
      run: |
        carton check
        echo "Dependencies check completed"

    - name: Check documentation
      run: |
        echo "Checking documentation completeness..."
        
        # Check for README
        if [[ -f README.md ]]; then
          echo "✅ README.md exists"
        else
          echo "❌ README.md missing"
        fi
        
        # Check for CLAUDE.md
        if [[ -f CLAUDE.md ]]; then
          echo "✅ CLAUDE.md exists"
        else
          echo "❌ CLAUDE.md missing"
        fi
        
        # Check for basic documentation in lib/
        undocumented_modules=$(find lib -name "*.pm" -exec grep -L "^=head1\|^# ABOUTME:" {} \; | wc -l)
        echo "Modules without documentation: $undocumented_modules"
        
        echo "Documentation check completed"

    - name: Setup test database for performance testing
      run: |
        export PGPASSWORD=postgres
        createdb -h localhost -U postgres registry_test || true

    - name: Performance test - Database schema deployment
      run: |
        export PERL5LIB="$HOME/perl5/lib/perl5:$PERL5LIB"
        export PATH="$HOME/perl5/bin:$PATH"
        export PGPASSWORD=postgres
        
        echo "Testing schema deployment performance..."
        time carton exec sqitch deploy db:pg://postgres@localhost/registry_test
        
        echo "Schema deployment completed"

    - name: List installed modules
      run: |
        carton list > dependency-report.txt
        echo "Dependency report generated"

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-report
        path: dependency-report.txt