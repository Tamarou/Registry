# ABOUTME: The single GitHub Actions workflow: unit/integration tests, lint, security, migrations, quality,
# ABOUTME: Playwright and real-Stripe e2e, and post-deploy validation -- one workflow, many jobs, local/ built once.

# Every job runs on ubuntu-24.04, pinned, not ubuntu-latest. The `install` job
# builds ./local once (XS modules such as DBD::Pg and Net::SSLeay compiled
# against the setup-perl 5.42 and this image's system libraries) and the other
# jobs download it, so every consumer must run on the same image as the
# builder. ubuntu-latest is now 26.04, which Playwright 1.55.1 also refuses
# ("does not support chromium on ubuntu26.04-x64"), so the browser jobs were
# already pinned to 24.04; the rest follow them. Do not unpin one job alone.
#
# This file was four workflows (CI, Playwright, Stripe E2E, Deploy
# Validation). The `on:` block below is the union of their triggers, and each
# job's `if:` restricts it to exactly the events that ran it before:
#   test, lint, security, database-compatibility, install: pull_request, push, schedule
#   quality:            push, schedule
#   e2e:                pull_request, push
#   stripe-e2e:         pull_request (same-repo only), push
#   deploy-validation:  push, workflow_dispatch
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC for quality checks
    - cron: '0 2 * * 0'

  # Allow manual trigger for ad-hoc deploy validation (deploy-validation job only)
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to validate'
        default: 'https://tinyartempire.com'

jobs:
  # Builds ./local once and hands it to every job that runs Perl from it.
  install:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpq-dev \
          postgresql-client \
          build-essential \
          libssl-dev \
          libz-dev

    - name: Install cpanm and carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # No cache step. local/ is built here, fresh, on the same pinned image
    # every consumer runs on, and passed on as an artifact (#501).
    - name: Install Perl dependencies
      run: |
        # Build Net::SSLeay against the system OpenSSL, the one DBD::Pg's libpq
        # links. actions-setup-perl exports OPENSSL_PREFIX at its own (3.2+)
        # OpenSSL and restores a cached ./local built against it; a process
        # holds one libssl.so.3, so one that touched the database first then
        # failed "version `OPENSSL_3.2.0' not found", which Mojo reports as
        # "IO::Socket::SSL 2.009+ required for TLS support" (#501).
        export OPENSSL_PREFIX=/usr
        rm -rf local
        # On failure, print each build log: cpanm writes them to disk and the
        # job output otherwise says only "See .../build.log".
        carton install --deployment || {
          for f in ~/.cpanm/work/*/build.log; do echo "::group::failed builds in $f"; awk '/^Entering /{n=0} {s[++n]=$0} /-> FAIL/{for(i=1;i<=n;i++) if(i<=30||i>n-70) print s[i]; else if(i==31) print "... (" n-100 " lines omitted)"; print "----"; n=0}' "$f"; echo "::endgroup::"; done
          exit 1
        }
        # Prove it: load the database client first, then TLS -- the order that
        # broke -- and show which libssl Net::SSLeay links.
        ldd local/lib/perl5/x86_64-linux/auto/Net/SSLeay/SSLeay.so | grep libssl
        # shellcheck disable=SC2016  # the single-quoted string is Perl code
        carton exec perl -MDBD::Pg -MIO::Socket::SSL -e 'print "IO::Socket::SSL $IO::Socket::SSL::VERSION loads after libpq\n"'

    # Tarred so file modes (local/bin scripts) and symlinks survive the
    # artifact round trip, which a plain directory upload does not preserve.
    - name: Pack local/
      run: tar -cf local.tar local

    - name: Upload local/
      uses: actions/upload-artifact@v4
      with:
        name: perl-local
        path: local.tar
        if-no-files-found: error
        retention-days: 1

  test:
    runs-on: ubuntu-24.04
    needs: install
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpq-dev \
          postgresql-client \
          build-essential \
          libssl-dev \
          libz-dev

    - name: Install cpanm and carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # local/ comes from the install job (see there for why there is no cache).
    - name: Download local/
      uses: actions/download-artifact@v4
      with:
        name: perl-local

    - name: Extract local/
      # setup-perl may restore its own stale cached local/; replace it, not merge into it.
      run: rm -rf local && tar -xf local.tar && rm local.tar

    - name: Setup test database
      run: |
        export PGPASSWORD=postgres
        # Wait for PostgreSQL to be ready with better reliability
        for i in {1..60}; do
          if pg_isready -h localhost -U postgres -d postgres; then
            echo "PostgreSQL is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/60)"
          sleep 3
        done
        
        # Create test database with proper error handling
        createdb -h localhost -U postgres registry_test || true
        
        # Verify the database exists by connecting to it, not by listing.
        # `psql -l` runs a catalog query built by the CLIENT, and the runner ships
        # postgresql-client 16 while this container is 18, where daticulocale was
        # renamed datlocale -- so the listing form fails against a newer server
        # even though the database is fine. Connecting proves more and is not
        # version-coupled.
        psql -h localhost -U postgres -d registry_test -c 'SELECT 1' > /dev/null
        echo "Test database registry_test is ready"
        
    - name: Deploy database schema
      run: |
        export PGPASSWORD=postgres
        carton exec sqitch deploy db:pg://postgres@localhost/registry_test

    - name: Import workflows and templates
      run: |
        export PGPASSWORD=postgres
        export DB_URL="postgresql://postgres:postgres@localhost:5432/registry_test"
        echo "Importing workflows..."
        carton exec ./registry workflow import registry || echo "Workflow import failed, continuing..."
        echo "Importing templates..."
        carton exec ./registry template import registry || echo "Template import failed, continuing..."
        echo "Import phase completed"

    - name: Clean test database
      run: |
        export PGPASSWORD=postgres
        # Clean up any existing test artifacts
        psql -h localhost -U postgres -d registry_test -c "
          TRUNCATE users, family_members, enrollments, payments, attendance_records, 
                   waitlist, sessions, events, session_events, projects, locations, 
                   messages, message_recipients CASCADE;" || true
        echo "Database cleaned for fresh test run"

    # The suite does NOT use the service container above: Test::Registry::DB
    # calls Test::PostgreSQL->new, which builds its own server, and each test
    # overwrites DB_URL with that ephemeral URI. Test::PostgreSQL picks the
    # HIGHEST major it finds (_find_program falls back to
    # `sort { $b cmp $a } glob "/usr/lib/postgresql/*"`), so the tested version
    # is an image detail that moves when GitHub rebuilds the runner. Report it,
    # and fail below the real floor -- the schema uses gen_random_uuid() in 20+
    # places with no CREATE EXTENSION anywhere in sql/, so it needs the built-in,
    # which is 13+. (CONTRIBUTING.md and docs/TECHNICAL.md say 12+; they are
    # wrong, and #334 tracks pinning this to production's major rather than
    # merely observing it.)
    - name: Report the PostgreSQL major the suite will actually use
      run: |
        # Same selection Test::PostgreSQL::_find_program makes: highest major present.
        server=$(ls -d /usr/lib/postgresql/* 2>/dev/null | sed 's#.*/##' | sort -rn | head -1)
        echo "Test::PostgreSQL will use PostgreSQL major: ${server:-unknown}"
        echo "Production (Render registry-db) runs: 18"
        case "$server" in
          ''|*[!0-9]*) echo "::error::could not determine the PostgreSQL major on this runner"; exit 1 ;;
        esac
        if [ "$server" -lt 13 ]; then
          echo "::error::PostgreSQL $server is below the real floor of 13 (gen_random_uuid is built-in from 13; sql/ never CREATE EXTENSION pgcrypto)"
          exit 1
        fi
        if [ "$server" -ne 18 ]; then
          echo "::warning::the suite is running on PostgreSQL $server, production runs 18 (#334)"
        fi

    - name: Run test suite
      run: |
        export PGPASSWORD=postgres
        export DB_URL="postgresql://postgres:postgres@localhost:5432/registry_test"
        export EMAIL_SENDER_TRANSPORT=Test
        # Placeholder so the Stripe DAO constructs; these tests make no real API
        # calls. It must NOT start with sk_test_: t/stripe-live/ gates itself on
        # that prefix, so a test-shaped placeholder makes the live suite believe
        # Stripe is reachable and fail against the real API. Real keys live in
        # the stripe-e2e job.
        export STRIPE_SECRET_KEY=ci_placeholder_not_a_stripe_key
        # In parallel, and with a timeout the suite can finish inside.
        #
        # This was `timeout 20m prove -lr t/` with no -j, and the suite outgrew
        # it. `timeout` then killed prove mid-file, so whichever file was in
        # flight reported "All N subtests passed" and then a non-zero exit: a
        # failure that names an innocent file, moves between runs, and
        # reproduces nowhere.
        #
        # "Sequentially to avoid database conflicts" was the old reason and it
        # does not hold. Every test file that touches a database builds its own
        # Test::PostgreSQL -- its own server, port and data directory -- either
        # through Test::Registry::DB, which also overrides the DB_URL exported
        # above, or directly. The postgres service here is used by exactly one
        # file. There is no shared state to serialise, which is why `make test`
        # has always run -j8.
        #
        # -j$(nproc) rather than a literal, because each worker runs a Postgres
        # of its own: the right width is the runner's, not a workstation's.
        timeout 75m carton exec prove -lr -j"$(nproc)" t/ --formatter=TAP::Formatter::Console

  lint:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install Perl::Critic
      run: |
        cpanm --notest Perl::Critic

    - name: Run Perl::Critic (non-blocking)
      run: |
        # Run perlcritic but don't fail the build on warnings
        # since Object::Pad code doesn't follow traditional Perl conventions
        find lib -name "*.pm" -exec perlcritic --severity=3 --quiet {} \; || true
        echo "Perl::Critic completed (warnings are informational only)"

    - name: Check for orphaned sqitch changes
      run: |
        # Every sql/deploy/*.sql must have a matching change entry in
        # sql/sqitch.plan. A change name is the first whitespace-delimited field
        # of a plan line; pragmas (%...) and comments (#...) never equal a change
        # name, so an exact first-field comparison is robust regardless of the
        # name's characters or whether it is followed by a space or a [requires].
        orphans=0
        for f in sql/deploy/*.sql; do
          n=$(basename "$f" .sql)
          awk -v n="$n" '$1 == n { found = 1 } END { exit found ? 0 : 1 }' sql/sqitch.plan \
            || { echo "ORPHAN: $n"; orphans=1; }
        done
        if [ "$orphans" -ne 0 ]; then
          echo "::error::Orphaned sql/deploy files are not in sql/sqitch.plan"
          exit 1
        fi
        echo "No orphaned sqitch changes."

  security:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security checks
      run: |
        echo "Checking for common security issues..."
        
        # Check for hardcoded secrets (basic patterns)
        if grep -r -i "password\s*=" --include="*.pm" --include="*.pl" lib/ | grep -v "EXAMPLE\|TODO\|FIXME" | head -5; then
          echo "WARNING: Potential hardcoded passwords found"
        fi
        
        # Check for SQL injection patterns
        if grep -r "qq{.*\$" --include="*.pm" lib/ | head -5; then
          echo "WARNING: Potential SQL injection patterns found"
        fi
        
        echo "Security check completed"

  database-compatibility:
    runs-on: ubuntu-24.04
    needs: install
    # The `if:` is an event filter only: the pull_request/push/schedule events
    # this job always ran on, excluding the workflow_dispatch that exists for
    # deploy-validation. No changed-paths gate here, deliberately. This job used
    # to be gated on
    #   contains(github.event.head_commit.modified, 'sql/')
    # and `head_commit` is null on pull_request events, so both contains() calls
    # were false and the job skipped on every PR -- including the ones that
    # rewrite sql/deploy/. It ran only after merge, or on the weekly cron, which
    # is precisely when a migration-compatibility failure is most expensive.
    #
    # Gating correctly on changed paths needs either a third-party filter action
    # or a base-ref diff with its own edge cases (shallow clones, force pushes,
    # first push on a branch). Running it every time costs three parallel jobs
    # and cannot silently skip, which is the property that was missing.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      matrix:
        # The versions that matter: production (Render `registry-db`) runs 18,
        # and 16/17 cover the majors below it. 14 and 15 were listed here while
        # the job never ran; nothing deploys them.
        postgres-version: [16, 17, 18]
    
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libpq-dev \
          postgresql-client \
          build-essential

    - name: Install cpanm and carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # local/ comes from the install job (see there for why there is no cache).
    - name: Download local/
      uses: actions/download-artifact@v4
      with:
        name: perl-local

    - name: Extract local/
      # setup-perl may restore its own stale cached local/; replace it, not merge into it.
      run: rm -rf local && tar -xf local.tar && rm local.tar

    - name: Test database migration
      run: |
        export PGPASSWORD=postgres
        
        echo "Testing PostgreSQL ${{ matrix.postgres-version }} migration..."
        
        # Create test database
        createdb -h localhost -U postgres registry_migration_test
        
        # Deploy schema
        carton exec sqitch deploy db:pg://postgres@localhost/registry_migration_test
        
        # Verify deployment
        carton exec sqitch status db:pg://postgres@localhost/registry_migration_test
        
        echo "Migration test completed successfully"

    # The `Test schema rollback` step that used to be here proved nothing and has
    # been removed rather than repaired. It ran
    #   carton exec sqitch revert -n 3 ... || true
    # where `|| true` swallowed any failure, and carton parsed `-n` as its own
    # --noverbose before sqitch ever saw it, so the revert was never attempted.
    # The redeploy on the next line then ran against an unreverted database and
    # succeeded vacuously.
    #
    # t/database/revert-round-trip.t grades reverts properly -- per change,
    # deploy to parent, dump, deploy, revert, dump, diff -- and runs in the test
    # job. That is the harness; this step was a decoy beside it.

  quality:
    runs-on: ubuntu-24.04
    needs: install
    if: github.event_name == 'schedule' || github.event_name == 'push'
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: registry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client build-essential

    - name: Install dependencies and tools
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # local/ comes from the install job (see there for why there is no cache).
    # `carton check` below verifies it satisfies the cpanfile.
    - name: Download local/
      uses: actions/download-artifact@v4
      with:
        name: perl-local

    - name: Extract local/
      # setup-perl may restore its own stale cached local/; replace it, not merge into it.
      run: rm -rf local && tar -xf local.tar && rm local.tar

    - name: Check dependencies
      run: |
        carton check
        echo "Dependencies check completed"

    - name: Check documentation
      run: |
        echo "Checking documentation completeness..."
        
        # Check for README
        if [[ -f README.md ]]; then
          echo "✅ README.md exists"
        else
          echo "❌ README.md missing"
        fi
        
        # Check for CLAUDE.md
        if [[ -f CLAUDE.md ]]; then
          echo "✅ CLAUDE.md exists"
        else
          echo "❌ CLAUDE.md missing"
        fi
        
        # Check for basic documentation in lib/
        undocumented_modules=$(find lib -name "*.pm" -exec grep -L "^=head1\|^# ABOUTME:" {} \; | wc -l)
        echo "Modules without documentation: $undocumented_modules"
        
        echo "Documentation check completed"

    - name: Setup test database for performance testing
      run: |
        export PGPASSWORD=postgres
        createdb -h localhost -U postgres registry_test || true

    - name: Performance test - Database schema deployment
      run: |
        export PGPASSWORD=postgres
        
        echo "Testing schema deployment performance..."
        time carton exec sqitch deploy db:pg://postgres@localhost/registry_test
        
        echo "Schema deployment completed"

    - name: List installed modules
      run: |
        carton list > dependency-report.txt
        echo "Dependency report generated"

    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-report
        path: dependency-report.txt
  e2e:
    # ubuntu-latest became 26.04, which Playwright 1.55.1 refuses ("does not
    # support chromium on ubuntu26.04-x64"), so this job stopped before any
    # test. Pinned until Playwright is moved to a release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Browser tests only after the unit tests pass.
    needs: [install, test]
    # The pull_request/push events of the old Playwright workflow; not on
    # schedule or workflow_dispatch.
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client build-essential libssl-dev libz-dev

    - name: Install cpanm and Carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # local/ comes from the install job (see there for why there is no cache).
    - name: Download local/
      uses: actions/download-artifact@v4
      with:
        name: perl-local

    - name: Extract local/
      # setup-perl may restore its own stale cached local/; replace it, not merge into it.
      run: rm -rf local && tar -xf local.tar && rm local.tar

    - name: Install Node dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox

    # The harness provisions its own ephemeral Postgres via Test::PostgreSQL
    # (globalSetup), so no service container is needed. Confirm Test::PostgreSQL
    # can start on the runner before running the suite; fail fast with a clear
    # message if the postgres binaries are unavailable.
    - name: Verify Test::PostgreSQL can start
      run: |
        # shellcheck disable=SC2016 # the single quotes are Perl source, not shell
        carton exec perl -MTest::PostgreSQL -e 'my $pg = Test::PostgreSQL->new; print "Test::PostgreSQL OK: ", $pg->uri, "\n"'

    # No STRIPE_SECRET_KEY: registration's free path stays in demo/decision-step
    # mode and no Stripe calls are made.
    - name: Run Playwright tests
      env:
        EMAIL_SENDER_TRANSPORT: Test
      run: |
        npx playwright test --project=chromium --project=firefox

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 14

  stripe-e2e:
    # ubuntu-latest became 26.04, which Playwright 1.55.1 refuses ("does not
    # support chromium on ubuntu26.04-x64"), so this job stopped before any
    # test. Pinned until Playwright is moved to a release that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Browser tests only after the unit tests pass.
    needs: [install, test]

    # Only the pull_request/push events of the old Stripe E2E workflow (not
    # schedule or workflow_dispatch), AND:
    # Skip for fork PRs: they have no access to repo secrets.
    # Runs on direct pushes to main and on same-repo PRs only.
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    env:
      # Stripe test-mode secrets -- must be pk_test_* / sk_test_* / whsec_* values.
      # Set STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, and STRIPE_WEBHOOK_SECRET
      # in GitHub repo Settings → Secrets and variables → Actions.
      # Job-level on purpose: no other job in this workflow may see them.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      EMAIL_SENDER_TRANSPORT: Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: '5.42'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client build-essential libssl-dev libz-dev

    - name: Install cpanm and Carton
      run: |
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm --notest Carton

    # local/ comes from the install job (see there for why there is no cache).
    - name: Download local/
      uses: actions/download-artifact@v4
      with:
        name: perl-local

    - name: Extract local/
      # setup-perl may restore its own stale cached local/; replace it, not merge into it.
      run: rm -rf local && tar -xf local.tar && rm local.tar

    - name: Install Node dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Verify Test::PostgreSQL can start
      run: |
        # shellcheck disable=SC2016 # the single quotes are Perl source, not shell
        carton exec perl -MTest::PostgreSQL -e 'my $pg = Test::PostgreSQL->new; print "Test::PostgreSQL OK: ", $pg->uri, "\n"'

    # Without this, the job passes without testing anything. Every file under
    # t/stripe-live/ calls Test::Registry::StripeConnect::available(), which is
    # `$ENV{STRIPE_SECRET_KEY} =~ /^sk_test_/`, and plan skip_all when it is
    # false. No key was ever provisioned, so the suite reported
    # `Files=4, Tests=0 ... Result: NOTESTS` -- and prove exits 0 on NOTESTS, so
    # the checks UI showed a green tick. A SKIP and a PASS must not look alike in
    # the one suite that guards the money path against real Stripe.
    - name: Require a Stripe test key
      run: |
        case "${STRIPE_SECRET_KEY}" in
          sk_test_*) echo "Stripe test key present; the live suites will run." ;;
          "") echo "::error::STRIPE_SECRET_KEY is not set. Add a Stripe TEST-mode secret key (sk_test_...) under Settings -> Secrets and variables -> Actions. Until then this suite tests nothing."
              exit 1 ;;
          sk_live_*) echo "::error::STRIPE_SECRET_KEY is a LIVE key. This suite creates real charges against whatever key it is given; only sk_test_ values are permitted."
              exit 1 ;;
          *) echo "::error::STRIPE_SECRET_KEY does not start with sk_test_, so every file under t/stripe-live/ will skip_all and report success without testing anything."
             exit 1 ;;
        esac

    - name: Run real-Stripe Perl suites
      run: |
        carton exec prove -lv t/stripe-live/

    - name: Run Playwright payment smoke test
      run: |
        npx playwright test t/playwright/payment-smoke.spec.js --project=chromium

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stripe-e2e-playwright-report
        path: playwright-report/
        retention-days: 14

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stripe-e2e-test-results
        path: test-results/
        retention-days: 14

  # Post-deploy browser validation against the live production site: runs
  # Playwright tests after Render deploys to verify rendering and functionality.
  deploy-validation:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # After a push to main (Render auto-deploys on push), or a manual
    # workflow_dispatch for ad-hoc validation. Never on pull_request or schedule.
    # Needs no Perl, so it does not wait for install.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Wait for Render deploy
      run: |
        URL="${{ github.event.inputs.url || 'https://tinyartempire.com' }}"
        echo "Waiting for deploy to complete at $URL..."
        # Render deploys take ~2-3 minutes after push
        sleep 180
        # Verify the site is up. The loop used to fall out of its last iteration
        # and let the step succeed, so a site that never came back looked the
        # same as one that did.
        for i in $(seq 1 10); do
          if curl -sf --max-time 10 "$URL/health" > /dev/null 2>&1; then
            echo "Site is up"
            exit 0
          fi
          echo "Attempt $i: site not ready, waiting..."
          sleep 15
        done
        echo "::error::$URL/health did not respond after 10 attempts"
        exit 1

    # playwright.deploy.config.js, not the main config: that one's globalSetup is
    # config-level and spawns `carton exec` to start a local DB and server, which
    # this job has no Perl for. It failed here with `spawn carton ENOENT` on every
    # run from 2026-04-12 onward, before reaching a single assertion.
    - name: Run deploy validation
      env:
        DEPLOY_VALIDATION_URL: ${{ github.event.inputs.url || 'https://tinyartempire.com' }}
      run: npx playwright test --config=playwright.deploy.config.js

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deploy-validation-results
        path: test-results/
        retention-days: 7
